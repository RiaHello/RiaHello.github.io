[project]
name = "ria-resume-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.2", "openai==2.54.0", "redis==8.1.0", "uvicorn==0.54.0", "httpx==0.28.1", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["redis: isolated real Redis atomicity tests (TEST_REDIS_URL required)"]
